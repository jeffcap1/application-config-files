# new leader key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g prefix-timeout 0

# closing panes
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session

# better last session using sesh
bind -N "last-session (via sesh) " L run-shell "sesh last"

# don't rename windows automatically
set-option -g allow-rename off

# fix colors
set -g default-terminal "tmux-256color"
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title:hyperlinks,screen*:title,rxvt*:ignorefkeys,xterm-ghostty*:RGB:hyperlinks,ghostty*:RGB:hyperlinks"


# undercurl
set -g terminal-overrides[0] 'linux*:AX@'
set -g terminal-overrides[1] 'xterm-ghostty*:Smulx=\E[4::%p1%dm'
set -g terminal-overrides[2] 'xterm-ghostty*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g terminal-overrides[3] '*:Ss=\E[%p1%d q:Se=\E[5 q'

# enable passthrough for image rendering
set -gq allow-passthrough on
set -g visual-activity off

# focus events
set-option -g focus-events on

# https://neovim.io/doc/user/term.html#tui-cursor-shape

# refresh tmux with leader + r
unbind r
bind r command-prompt "rename-window %%"
bind R source ~/.config/tmux/tmux.conf


# splits and navigation
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0
set -g base-index 1                  # start indexing windows at 1 instead of 0
set -g pane-base-index 1             # start indexing panes at 1 instead of 0
set -g renumber-windows on           # renumber all windows when any window is closed

# options
set -g escape-time 0                 # zero-out escape time delay
set -g history-limit 1000000         # increase history size (from 2,000)
set -g set-clipboard on              # use system clipboard
set -s clear-on-attach off           # keep terminal output in scrollback on attach
set -g copy-mode-line-numbers hybrid # vim-style line numbers in copy mode
set -g pane-scrollbars auto-hide     # scrollbar shows while scrolling/hovering

# status bar
set -g status-justify left
set -g status-left-length 200
set -g status-right-length 200
set -g status-position top

# set vi mode
set -g xterm-keys on
set -g mode-keys vi
set -g status-keys vi

# better dx
bind-key N command-prompt -p "New session:" "new-session -s '%%'"

# workmux keys
bind-key e run-shell "~/.config/tmux/scripts/workmux-sidebar-toggle.sh '#{window_id}'"

# resize panes
bind-key m switch-client -T resize
bind-key -r -T resize h resize-pane -L 5 \; switch-client -T resize
bind-key -r -T resize j resize-pane -D 5 \; switch-client -T resize
bind-key -r -T resize k resize-pane -U 5 \; switch-client -T resize
bind-key -r -T resize l resize-pane -R 5 \; switch-client -T resize
bind-key -T resize Escape switch-client -T root

# copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# keybinding fixes
unbind k
bind-key -n C-l if-shell -F '#{||:#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},vim}},#{==:#{pane_current_command},view}}' {
  send-keys C-l
} {
  send-keys -R
  send-keys C-l
  clear-history
}

########  display popups  ########

# lazygit in a modal floating pane (tmux 3.8): real pane, so ghostty bg shows
# through. -K passes all keys (incl. prefix) to lazygit; it closes on exit.
bind g new-pane -O -K -c "#{pane_current_path}" -x 90% -y 90% -X 5% -Y 5% lazygit

bind b new-pane -O -K -c "#{pane_current_path}" -x 90% -y 90% -X 5% -Y 5% "workmux dashboard"

# Toggleable scratch terminal. The popup attaches to a per-session
# "_popup_<session>" session on a separate tmux server (-L popup), so the shell
# survives between toggles and never shows up in sesh/resurrect.
# prefix + ; inside the popup detaches (hides it); outside it opens it.
# run-shell -C is needed because display-popup doesn't expand #{} in its command.
bind ";" if-shell -F "#{m:*/popup,#{socket_path}}" {
  detach-client
} {
  run-shell -C "display-popup -d '#{pane_current_path}' -w 90% -h 90% -E \"env -u TMUX tmux -L popup new-session -A -s '_popup_#{session_name}' ';' set status off\""
}

# Sesh keybinding
bind-key "T" clock-mode
unbind t
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""


set -g @continuum-save-interval '5'
# set -g @continuum-restore 'on'

# the scratch-popup server (-L popup) must not overwrite resurrect snapshots
%if "#{m:*/popup,#{socket_path}}"
  set -g @continuum-save-interval '0'
%endif

# resurrect strategy
set -g @resurrect-strategy-nvim 'session'

# tmux-naviagtor remap
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"

# theme flavor
set -g @catppuccin_flavor "macchiato"

# status format
set -g @catppuccin_status_background "none"
set -g @catppuccin_status_connect_separator "no"

# window format
# "custom" rounded pills: v2's built-in "rounded" emits fg=none (invalid) when
# @catppuccin_status_background is "none", breaking the pill edges.
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[fg=#{@thm_surface_0},bg=default]\uE0B6"
set -g @catppuccin_window_middle_separator ""
set -g @catppuccin_window_right_separator "#[fg=#{@thm_surface_0},bg=default]\uE0B4 "
set -g @catppuccin_window_current_left_separator "#[fg=#{@thm_peach},bg=default]\uE0B6"
set -g @catppuccin_window_current_middle_separator ""
set -g @catppuccin_window_current_right_separator "#[fg=#{@thm_peach},bg=default]\uE0B4 "
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_flags "icon"

# window default format (number + text on surface_0, light text)
set -g @catppuccin_window_number_color "#{@thm_surface_0}"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_number "#[fg=#{@thm_fg}]#I"
set -g @catppuccin_window_text "#W"

# window current format (number + text filled peach, dark text)
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text_color "#{@thm_peach}"
set -g @catppuccin_window_current_text "#[fg=#{@thm_crust}]#W"

# clear opencode status marker when window is focused
set-hook -g after-select-window 'set-window-option -q -u @opencode_status'
set-hook -g session-window-changed 'set-window-option -q -u @opencode_status'
set-hook -g client-focus-in 'set-window-option -q -u @opencode_status'

# status format
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_module_text_bg "#{@thm_surface_1}"

# directory format
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# date format
set -g @catppuccin_date_time_text " %H:%M"

# clima text (leading space pads the weather icon off the separator)
set -g @catppuccin_clima_text " #{l:#{clima}}"

# session text (same padding)
set -g @catppuccin_session_text " #S"

# clima format
set -g @clima_location "Wayne,NJ,US"
set -g @clima_unit imperial
set -g @clima_show_location 0 # hide location
set -g @clima_use_nerd_font 1
# set -g @clima_ttl <value_in_minutes> # default is 15

# Load catppuccin theme
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# modules list
## left
set -g status-left "#{E:@catppuccin_status_session}"

## right
# set -g status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_directory}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_clima}"


set-window-option -g window-size latest


########## plugin list ##########

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'jimeh/tmuxifier'


## vim-tmux-navigator
# https://github.com/christoomey/vim-tmux-navigator/issues/295#issuecomment-1021591011
# https://github.com/christoomey/vim-tmux-navigator/issues/417#issue-2680982876
# Temporary fix needs to be added to `~/.local/share/nvim/lazy/vim-tmux-navigator/vim-tmux-navigator.tmux`

# Load catppuccin theme first
set -g @plugin 'catppuccin/tmux#v2.3.1'

# Load catppuccin plugins after
set -g @plugin 'vascomfnunes/tmux-clima'

# Fixes plugin being overwritten by theme
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# panes
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_peach},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_peach}}}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '~/.tmux/plugins/tpm/tpm'
 run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'

# Override message style after all plugins load (catppuccin resets these).
# tmux 3.7+ needs fill= for the message bar to span the full width.
set -g message-style 'fg=#cad3f5,bg=#1e2030,fill=#1e2030'
set -g message-command-style 'fg=#cad3f5,bg=#1e2030,fill=#1e2030'

# tmux 3.8 underlines the current window by default; catppuccin doesn't reset it.
set -g window-status-current-style default

# tmux 3.8 defaults popup/menu styles to theme grey; catppuccin sets popups to
# a solid bg and never sets menu-style, so override here.
# bg=default lets ghostty's background (opacity/blur/image) show through popups.
set -gwF popup-style 'bg=default,fg=#{@thm_fg}'
set -gwF popup-border-style 'bg=default,fg=#{@thm_surface_1}'
set -gwF menu-style 'bg=#{@thm_bg},fg=#{@thm_fg}'
set -gwF menu-border-style 'bg=#{@thm_bg},fg=#{@thm_surface_1}'

# These must appear after TPM so they override the plugin's bindings.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

is_vim="ps -o tty= -o state= -o comm= \
  | grep -iqE '^#{s|/dev/||:pane_tty} +[^TXZ ]+ +${vim_pattern}$'"

bind-key -n M-h if-shell "$is_vim" \
  { send-keys M-h } \
  { if-shell -F '#{pane_at_left}' \
      { run-shell -b 'aerospace focus left >/dev/null 2>&1 || true' } \
      { select-pane -L } }

bind-key -n M-j if-shell "$is_vim" \
  { send-keys M-j } \
  { if-shell -F '#{pane_at_bottom}' \
      { run-shell -b 'aerospace focus down >/dev/null 2>&1 || true' } \
      { select-pane -D } }

bind-key -n M-k if-shell "$is_vim" \
  { send-keys M-k } \
  { if-shell -F '#{pane_at_top}' \
      { run-shell -b 'aerospace focus up >/dev/null 2>&1 || true' } \
      { select-pane -U } }

bind-key -n M-l if-shell "$is_vim" \
  { send-keys M-l } \
  { if-shell -F '#{pane_at_right}' \
      { run-shell -b 'aerospace focus right >/dev/null 2>&1 || true' } \
      { select-pane -R } }
