# Hyprspace starter config.
#
# This file is intentionally small. Hyprspace already provides opinionated built-in
# defaults for the dwindle-friendly layout behavior, so this file only contains the
# first shortcuts new users are likely to want immediately.
#
# For a fuller reference config, see: ~/.config/hyprspace/docs/default-config.toml
# For path rules, see: ~/.config/hyprspace/docs/README.md
# For all available config options and commands, see:
# https://nikitabobko.github.io/AeroSpace/guide
# https://nikitabobko.github.io/AeroSpace/commands

config-version = 2
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = true

after-startup-command = [
    'exec-and-forget borders active_color=0xff50bfcb inactive_color=0xff414550 width=8.0 hidpi=off',
]

exec-on-workspace-change = []

# Hold alt and drag from anywhere inside a tiled window to move and reinsert it at the drop point.
[mouse-drag]
enabled = true
modifier = 'alt'

[gaps]
inner.horizontal = 18
inner.vertical = 18
outer.left = 18
outer.right = 18
outer.bottom = 18
outer.top = 18

# ---------- MAIN KEY BINDINGS -----------

[mode.main.binding]
alt-enter = 'new-window-or-open Ghostty'
alt-ctrl-shift-cmd-b = 'exec-and-forget open /Applications/Beekeeper\ Studio.app'
alt-ctrl-shift-cmd-w = 'exec-and-forget open /Applications/Helium.app'
alt-w = 'exec-and-forget open -n /Applications/Helium.app'
alt-ctrl-shift-cmd-e = 'exec-and-forget open /System/Applications/Mail.app'
alt-ctrl-shift-cmd-t = 'exec-and-forget open /Applications/TablePro.app'
alt-ctrl-shift-cmd-n = 'exec-and-forget open /Applications/Obsidian.app'
alt-shift-p = 'open-terminal Ghostty btop'

cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-9 = 'workspace 9'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-9 = 'move-node-to-workspace 9'

cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

alt-tab = 'focus-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-space = 'layout floating tiling'
alt-shift-semicolon = 'mode service'
alt-shift-slash = 'layout tiles horizontal vertical'
alt-shift-comma = 'layout accordion horizontal vertical'

# Resize the focused window. On a popped-out (floating) window these resize around
# its center, so it grows and shrinks evenly on all sides.
#   alt -/=  (minus/equal)       width
#   alt _/+  (shift minus/equal) height
alt-minus = 'resize width -50'
alt-equal = 'resize width +50'
alt-shift-minus = 'resize height -50'
alt-shift-equal = 'resize height +50'
alt-f = 'fullscreen'
alt-cmd-f = 'macos-native-fullscreen'

# ---------- SERVICE MODE -----------

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
alt-shift-semicolon = 'mode main'

# ---------- WINDOW CONTROL -----------

[[on-window-detected]]
if.app-id = "com.apple.ScreenSharing"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.apple.MobileSMS"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = 'com.apple.iphonesimulator'
run = ["layout floating"]

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['layout floating']

[[on-window-detected]]
if.app-id = "com.microsoft.teams2"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = 'com.macpaw.CleanMyMac'
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.macpaw.CleanMyMac4"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.bitwarden.desktop"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.apple.QuickTimePlayerX"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "ai.krisp.krispMac"
run = ["layout floating"]
